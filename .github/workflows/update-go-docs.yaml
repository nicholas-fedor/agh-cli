name: Update Go Docs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Skip the pkg.go.dev update"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      dry-run:
        description: "Skip the pkg.go.dev update"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update-go-docs:
    name: Update pkg.go.dev
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Run pkg.go.dev update
        uses: nicholas-fedor/go-proxy-pull-action@8f784b07227e87c2d6555d3805c3a83e02e29227 # v1.1.52
        with:
          goproxy: https://proxy.golang.org
          import_path: github.com/nicholas-fedor/agh-cli
