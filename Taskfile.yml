version: "3"

vars:
  BINARY_NAME: agh-cli
  BINARY_DIR: bin
  PKG: github.com/nicholas-fedor/agh-cli
  VERSION:
    sh: "git describe --tags --always --dirty"
  COMMIT:
    sh: "git rev-parse --short HEAD"
  BUILD_TIME:
    sh: "date -u +%Y-%m-%dT%H:%M:%SZ"
  # trimpath strips ldflags until https://github.com/golang/go/pull/68544 merged
  # GOFLAGS: -trimpath
  LDFLAGS: >-
    -s -w
    -X '{{.PKG}}/internal/metadata.Version={{.VERSION}}'
    -X '{{.PKG}}/internal/metadata.CommitSHA={{.COMMIT}}'
    -X '{{.PKG}}/internal/metadata.BuildTime={{.BUILD_TIME}}'
  # Test, bench, and fuzz runs skip the generated mocks, which hold no tests of their own.
  PKGS:
    sh: go list ./... | grep -v /mocks$ | tr '\n' ' '

tasks:
  build:
    desc: Build Go binary
    cmds:
      - go build {{.GOFLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.BINARY_DIR}}/{{.BINARY_NAME}} .

  run:
    desc: Run Go application
    cmds:
      - go run .

  mocks:
    desc: Generate test mocks using mockery
    cmds:
      - mockery --config=build/mockery/mockery.yaml
    preconditions:
      - sh: "command -v mockery"
        msg: "mockery must be installed (run: task mockery-install)"

  test:
    desc: Run the tests with race detection and an 80% coverage gate, writing coverage.out
    vars:
      COVERAGE_MIN: "80"
    cmds:
      - go test -race -count=1 -covermode=atomic -coverprofile=coverage.out {{.PKGS}}
      - |
        go tool cover -func=coverage.out \
          | awk -v min={{.COVERAGE_MIN}} '/^total:/ { gsub(/%/, "", $3);
              if ($3 + 0 < min + 0) {
                printf "coverage %.1f%% is below the %s%% gate\n", $3, min
                exit 1
              }
              printf "coverage %.1f%% meets the %s%% gate\n", $3, min }'

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -run='^$' {{.PKGS}}

  fuzz:
    desc: Run each fuzz target for 30s, or FUZZTIME=<duration> to override
    # go test fuzzes one target in one package per run, so the loop lists each
    # package's fuzz targets and runs them one at a time, anchored so that one
    # name cannot match another. set -eu stops at the first failure.
    # FUZZTIME has no vars entry, because a declared var would shadow the command line.
    cmds:
      - |
        set -eu
        for pkg in {{.PKGS}}; do
          for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
            echo "fuzzing $pkg $target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime={{.FUZZTIME | default "30s"}} "$pkg"
          done
        done

  modernize:
    desc: Fail when the go fix modernizers would change the code, or apply them with FIX=true
    # Run after every Go toolchain upgrade to adopt the new version's idioms.
    cmds:
      - |
        if [ "{{.FIX | default "false"}}" = "true" ]; then
          go fix ./...
        else
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo "modernize: run 'task modernize FIX=true' to apply" >&2
            exit 1
          fi
        fi

  vuln:
    desc: Report known vulnerabilities in the dependency graph
    cmds:
      - govulncheck ./...
    preconditions:
      - sh: "command -v govulncheck"
        msg: "govulncheck must be installed (run: task govulncheck-install)"

  lint:
    desc: Run the linters, applying their fixes, and report structs whose fields betteralign would reorder
    cmds:
      - golangci-lint run --fix --config build/golangci-lint/golangci-lint.yaml ./...
      - betteralign ./...
    preconditions:
      - sh: "command -v betteralign"
        msg: "betteralign must be installed (run: task betteralign-install)"

  fmt:
    desc: Reorder struct fields with betteralign, then format the code
    cmds:
      - betteralign -apply ./...
      - golangci-lint fmt --config build/golangci-lint/golangci-lint.yaml ./...
    preconditions:
      - sh: "command -v betteralign"
        msg: "betteralign must be installed (run: task betteralign-install)"

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy
      - go mod verify

  docs:
    desc: Generate CLI documentation in Markdown format
    cmds:
      - go run ./tools/docgen -out ./www/content/cli-reference

  docs-check:
    desc: Verify the generated CLI documentation is up to date
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        go run ./tools/docgen -out "$tmp/cli-reference"
        if ! diff -r -q ./www/content/cli-reference "$tmp/cli-reference"; then
          echo "Generated CLI reference is out of date; run: task docs" >&2
          exit 1
        fi
        echo "Generated CLI reference is up to date"

  docs-serve:
    desc: Run a Hugo dev server
    cmds:
      - hugo server --buildDrafts --disableFastRender --baseURL http://localhost:1313 --source www
    preconditions:
      - sh: "command -v hugo"
        msg: "Hugo Extended must be installed to serve the documentation site"

  docs-clean:
    desc: "Remove generated CLI documentation (regenerate with: task docs)"
    cmds:
      - rm -rf ./www/content/cli-reference

  install:
    desc: Install agh-cli into the Go binary directory with its version metadata
    cmds:
      - go install {{.GOFLAGS}} -ldflags="{{.LDFLAGS}}" .

  update:
    desc: Update every dependency to its latest release, then tidy and verify the modules
    cmds:
      - go get -u ./...
      - task: tidy

  uninstall:
    desc: Remove agh-cli from the Go binary directory, keeping its configuration and stored credentials
    cmds:
      - |
        bindir="$(go env GOBIN)"
        [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
        rm -f "$bindir/{{.BINARY_NAME}}"

  check:
    desc: Run fmt, vet, test, lint, vuln, and docs-check, a local subset of the CI checks
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: lint
      - task: vuln
      - task: docs-check

  # Release Tasks

  release:snapshot:
    desc: Build the nightly images locally with GoReleaser, one per platform, without publishing them
    cmds:
      - goreleaser release --config build/goreleaser/nightly.yaml --snapshot --clean --skip=validate,archive
    preconditions:
      - sh: "command -v goreleaser"
        msg: "GoReleaser must be installed (run: task goreleaser-install)"

  tag:bump-major:
    desc: Tag the next major release on main, vX.0.0, and push it to origin
    cmds:
      - task: tag:release
        vars: { PART: major }

  tag:bump-minor:
    desc: Tag the next minor release on main, vX.Y.0, and push it to origin
    cmds:
      - task: tag:release
        vars: { PART: minor }

  tag:bump-patch:
    desc: Tag the next patch release on main, vX.Y.Z, and push it to origin
    cmds:
      - task: tag:release
        vars: { PART: patch }

  tag:release:
    internal: true
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    vars:
      RELEASE_TAG: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      LATEST:
        sh: |
          git fetch --quiet --tags origin main
          git tag --list 'v*' | grep -E '{{.RELEASE_TAG}}' | sort -V | tail -n 1
      NEXT:
        sh: |
          echo "{{.LATEST | default "v0.0.0"}}" | awk -F. -v part={{.PART}} '{
            major = substr($1, 2); minor = $2; patch = $3
            if (part == "major") { major++; minor = 0; patch = 0 }
            if (part == "minor") { minor++; patch = 0 }
            if (part == "patch") { patch++ }
            printf "v%d.%d.%d\n", major, minor, patch }'
    preconditions:
      - sh: '[ "$(git branch --show-current)" = main ]'
        msg: Releases are tagged on main
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: Commit or stash the changes in the working tree first
      - sh: '[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]'
        msg: main must match origin/main, so pull or push first
      - sh: '[ -z "$(git tag --points-at HEAD | grep -E "{{.RELEASE_TAG}}")" ]'
        msg: HEAD already has a release tag
    prompt: Tag {{.NEXT}} after {{.LATEST | default "no release"}} and push it to origin?
    cmds:
      # --force skips the preconditions above, so a forced run stops here before it tags.
      - cmd: 'echo "Tag the release without --force, because --force skips the release checks" >&2; exit 1'
        if: '[ "{{.CLI_FORCE}}" = true ]'
      - git tag {{.NEXT}} -m "Release {{.NEXT}}"
      - git push origin {{.NEXT}}

  # Utility Tasks

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ dist/
      - rm -f coverage.out

  golangci-lint-install:
    desc: Install Golangci-lint for linting the project
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    preconditions:
      - sh: "command -v go"
        msg: "Go must be installed"

  goreleaser-install:
    desc: Install GoReleaser for building the project
    cmds:
      - go install github.com/goreleaser/goreleaser/v2@latest
    preconditions:
      - sh: "command -v go"
        msg: "Go must be installed"

  mockery-install:
    desc: Install mockery for generating test mocks
    cmds:
      - go install github.com/vektra/mockery/v3@latest
    preconditions:
      - sh: "command -v go"
        msg: "Go must be installed"

  govulncheck-install:
    desc: Install govulncheck for scanning the dependencies for known vulnerabilities
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
    preconditions:
      - sh: "command -v go"
        msg: "Go must be installed"

  betteralign-install:
    desc: Install betteralign for ordering struct fields
    cmds:
      - go install github.com/dkorunic/betteralign/cmd/betteralign@latest
    preconditions:
      - sh: "command -v go"
        msg: "Go must be installed"

  install-tools:
    desc: Install required Go-based development tools
    cmds:
      - task: golangci-lint-install
      - task: betteralign-install
      - task: goreleaser-install
      - task: mockery-install
      - task: govulncheck-install

  check-tools:
    desc: Check which development tools are installed
    cmds:
      - |
        echo "Checking required tools:"
        echo ""
        echo "  task: $(command -v task >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: go install github.com/go-task/task/v3/cmd/task@latest)')"
        echo "  golangci-lint: $(command -v golangci-lint >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: task golangci-lint-install)')"
        echo "  betteralign: $(command -v betteralign >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: task betteralign-install)')"
        echo "  goreleaser: $(command -v goreleaser >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: task goreleaser-install)')"
        echo "  mockery: $(command -v mockery >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: task mockery-install)')"
        echo "  govulncheck: $(command -v govulncheck >/dev/null 2>&1 && echo '✓ installed' || echo '✗ NOT FOUND (run: task govulncheck-install)')"

  setup:
    desc: Initial project setup (install dependencies and tools)
    cmds:
      - go mod download
      - task install-tools
      - echo "Setup complete"
